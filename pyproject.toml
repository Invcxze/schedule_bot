[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "schedule-telegram-bot"
version = "0.1.0"
description = "Telegram timetable bot for Google Sheets and Excel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.19,<4",
    "aiohttp>=3.11,<4",
    "celery[redis]>=5.4,<6",
    "google-auth[requests]>=2.38,<3",
    "openpyxl>=3.1.5,<4",
    "python-dotenv>=1.0,<2",
    "tzdata>=2024.1; sys_platform == 'win32' or sys_platform == 'linux'",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
schedule-bot = "schedule_bot.__main__:main"

[tool.setuptools.packages.find]
include = ["schedule_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/test_parser.py" = ["E501"]  # Raw OOXML fixture content.
